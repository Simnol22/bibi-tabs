# Written, not deployed. `fly launch` will want to rewrite this -- keep the
# app name and the health check when it does.

app = "bibi-tabs"
primary_region = "yul"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true          # a PWA will not install over plain http
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
