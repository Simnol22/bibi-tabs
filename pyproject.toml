[project]
name = "bibi-tabs"
version = "1.0.0"
description = "Open a guitar chord sheet from a link, keep it, read it offline."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bibi = "bibi.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bibi"]

[tool.setuptools.package-data]
bibi = ["data/*.json", "data/LICENSE-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
